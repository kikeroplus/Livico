; Livico: WorkingTimer のタイマーと PC の情報を 1 つの画面に出す端末
; 機体は SpeechTest と同じもの (InfoPanel の env:speaker と同じ)。ESP32-S3-DevKitC-1 N16R8 (Flash 16MB QIO / PSRAM 8MB Octal)
; ST7789 240x320 (横置き 320x240)、MAX98357A + スピーカー、スイッチ 3 個
[platformio]
default_envs = livico

[env:livico]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
monitor_speed = 115200
; 書き込みとシリアルモニタは基板の「COM」(UART) 側の USB 端子を使う。COM 番号が決まったら upload_port を書く
; upload_port = COM7
lib_deps =
  moononournation/GFX Library for Arduino@1.4.7
  tzapu/WiFiManager@2.0.17
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
